name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go test -race -count=1 ./...

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-arg VERSION=${{ github.sha }} -t mbongo .
      - run: |
          docker run -d --name mbongo -p 8080:8080 mbongo
          for i in $(seq 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs mbongo; exit 1
